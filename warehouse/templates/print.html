<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Печать этикеток</title>
<link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
<style>
.print-page{width:min(1380px,calc(100% - 36px));margin:0 auto;padding:28px 0 44px}.print-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.print-toolbar h1{margin:0;color:var(--blue-950);font-size:28px}.print-toolbar p{margin:5px 0 0;color:var(--muted)}
.labels-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}.label-card{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;padding:15px;border:1px solid var(--line);border-radius:15px;background:white;box-shadow:var(--shadow)}.label-preview{display:grid;place-items:center;width:100%;min-height:210px;padding:14px;border-radius:11px;background:#edf5fa}.qr-img{display:block;width:384px;max-width:100%;height:auto;box-shadow:0 5px 16px #1e526f20}.label-meta{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px}.label-id{color:var(--muted);font-size:12px;font-weight:700}.label-error{color:var(--danger);font-size:13px}
@media(max-width:620px){.print-page{width:calc(100% - 22px);padding-top:18px}.print-toolbar{align-items:flex-start;flex-direction:column}.labels-container{grid-template-columns:1fr}}
@media print{html,body{margin:0!important;padding:0!important;background:white!important}.no-print,.printSingleBtn,.toast-region{display:none!important}.print-page{width:auto;margin:0;padding:0}.labels-container{display:block}.label-card{display:block;width:48mm;height:30mm;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;page-break-after:always;break-after:page}.label-preview{display:block;width:48mm;height:30mm;min-height:0;padding:0;border-radius:0;background:white}.qr-img{width:48mm;height:30mm;max-width:none;box-shadow:none}.label-meta{display:none}@page{size:48mm 30mm;margin:0}}
</style></head>
<body>
<main class="print-page">
<div class="print-toolbar no-print"><div><div class="eyebrow">Предпросмотр</div><h1>Этикетки к печати</h1><p>Проверьте макеты или отправьте отдельную этикетку на Niimbot.</p></div><div class="page-heading-actions"><nav class="qr-buttons page-nav" aria-label="Навигация"><a href="/"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h16M9 10v9"/></svg>Товары</a><a href="/scan"><svg class="icon" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>Сканирование</a><a href="/label-editor"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Редактор</a></nav><button id="printBtn" class="primary"><svg class="icon" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5V9h14v8h-2"/><path d="M7 14h10v6H7z"/></svg>Печатать все</button></div></div>
<div class="labels-container">{% for item in items %}<article class="label-card"><div class="label-preview">{% if item.label_error %}<p class="label-error">Предмет {{ item.id }}: {{ item.label_error }}</p>{% else %}<img class="qr-img" src="{{ item.qr_base64 }}" alt="Этикетка {{ item.id }}">{% endif %}</div><div class="label-meta no-print"><span class="label-id">ID: {{ item.id }}</span><button class="printSingleBtn" data-id="{{ item.id }}"><svg class="icon" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5V9h14v8h-2"/><path d="M7 14h10v6H7z"/></svg>На принтер</button></div></article>{% endfor %}</div>
</main><div id="toastRegion" class="toast-region no-print" aria-live="polite"></div>
<script>
function showToast(message,type='success'){const toast=document.createElement('div');toast.className=`toast ${type}`;toast.textContent=message;document.getElementById('toastRegion').append(toast);requestAnimationFrame(()=>toast.classList.add('show'));setTimeout(()=>{toast.classList.remove('show');setTimeout(()=>toast.remove(),250)},4500)}
document.getElementById('printBtn').addEventListener('click',()=>window.print());
document.querySelectorAll('.printSingleBtn').forEach(button=>button.addEventListener('click',async function(){const itemId=this.dataset.id,original=this.innerHTML;this.disabled=true;this.innerHTML='<span class="button-spinner"></span> Печать…';showToast(`Этикетка ${itemId}: задание отправлено`,'info');try{const response=await fetch(`/api/print_item/${itemId}`),data=await response.json();if(!response.ok)throw new Error(data.error||data.details||'Ошибка печати');showToast(`Этикетка ${itemId} напечатана`)}catch(error){showToast(error.message,'error')}finally{this.disabled=false;this.innerHTML=original}}));
</script></body></html>
