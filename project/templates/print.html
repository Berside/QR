<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печать этикеток с QR-кодами</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .labels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .label-card {
            width: 180px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
            margin-bottom: 10px;
        }
        .qr-img {
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }
        .item-info {
            margin: 8px 0 10px;
            font-size: 12px;
        }
        button {
            margin-bottom: 20px;
            padding: 8px 16px;
            font-size: 16px;
        }
        @media print {
            button {
                display: none;
            }
            .label-card {
                page-break-after: always;
                break-after: page;
                width: 60mm;
                height: 30mm;
                padding: 2mm;
                margin: 10px;
                box-sizing: border-box;
            
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: flex-start;
                gap: 2mm;
            }
            .item-info {
                font-size: 13px; 
                line-height: 1.3;
                margin-top: 1mm;
                flex: 1;
                text-align: left;
            }
            .qr-img {
                width: 25mm;
                height: 25mm;
                flex-shrink: 0;
            }
            @page {
                size: 80mm 40mm;
                margin: 0mm;
            }
        }
    </style>
</head>
<body>
    <button id="printBtn">Печатать</button>
    <div class="labels-container">
        {% for item in items %}
        <div class="label-card">
            <img class="qr-img" src="{{ item.qr_base64 }}" alt="QR-код">
            <div class="item-info">
                {% for column in label_columns if item.get(column) %}
                    {{ column }}: {{ item.get(column) }}<br>
                {% endfor %}
            </div>
            <button class="printSingleBtn" data-id="{{ item.id }}">Печать</button>
        </div>
        {% endfor %}
    </div>

    <script>
        document.getElementById('printBtn').addEventListener('click', function() {
            window.print();
        });

        // document.querySelectorAll('.printSingleBtn').forEach(button =>{
        //     button.addEventListener('click', function(){
        //         const itemId = this.getAttribute('data-id');
        //         window.location.href = `/api/print_item/${itemId}`;  
        //     })
        // })
        document.querySelectorAll('.printSingleBtn').forEach(button => {
                button.addEventListener('click', async function() {
                    const itemId = this.getAttribute('data-id');
                    // window.location.href = `/api/print_item/${itemId}`;
                    try {
                        const response = await fetch(`/api/print_item/${itemId}`);
                        const data = await response.json();
                        if (response.ok) {
                            alert('✅ Печать выполнена успешно!');
                        } else {
                            alert('❌ Ошибка: ' + (data.error || data.details || 'Неизвестная ошибка'));
                        }
                    } catch (err) {
                        alert('❌ Ошибка соединения: ' + err.message);
                    }
                });
            });
    </script>
</body>
</html>
