<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печать одной этикетки</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 16px; 
        }
        .label-card {
            width: 180px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
            margin-bottom: 10px;
        }
        .labels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .qr-img { 
            width: 150px; 
            height: 150px; 
            margin: 0 auto; 
        }
        .item-info {
            margin: 8px 0 10px;
            font-size: 12px;
        }
        button {
            margin-bottom: 20px;
            padding: 8px 16px;
            font-size: 16px;
        }
        @media print {
            button {
                display: none;
            }
            .label-card {
                width: 60mm;
                height: 30mm;
                padding: 2mm;
                margin: 0;
                box-sizing: border-box;
            
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: flex-start;
                gap: 2mm;
            }
            .item-info {
                font-size: 11px; 
                line-height: 1.3;
                margin: 0;
                flex: 1;
                text-align: left;
            }
            .qr-img {
                width: 25mm;
                height: 25mm;
                flex-shrink: 0;
            }
            @page {
                size: 80mm 40mm;
                margin: 0mm;
            }
        }
    </style>
</head>
<body>
    <div class="labels-container">
        <div class="label-card">
            <img class="qr-img" src="{{ item.qr_base64 }}" alt="QR-код">
            <div class="item-info">
                <strong>{{ item.name }}</strong><br>
                ID: {{ item.id }}<br>
                Изделие: {{ item.product }}<br>
                Место: {{ item.placement_location or '—' }}
            </div>
            <button onclick="window.print()">Печать</button>
        </div> 
    </div>
    <script>
        window.onload = function() {
            window.print();
            window.open(`/api/print_item/${itemId}`, '_blank');
        };
    </script>
</body>
</html>
